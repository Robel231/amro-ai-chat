<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with Amro AI, an intelligent chatbot powered by advanced AI technology.">
    <title>Amro AI Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body>
    <div id="chat-container">
        <h1>Amro AI Chat</h1>
        
        <div id="chat-box" role="log" aria-live="polite">
            <!-- Chat messages will appear here -->
        </div>
        
        <form id="chat-form" aria-label="Chat input form">
            <label for="user-input" class="visually-hidden">Type your message:</label>
            <input 
                type="text" 
                id="user-input" 
                placeholder="Type your message..." 
                autocomplete="off" 
                maxlength="250" 
                aria-label="Chat message input">
            <button type="submit" aria-label="Send message">Send</button>
        </form>
        
        <div id="status" aria-live="polite" role="status">
            <!-- Error messages or status updates can appear here -->
        </div>
    </div>
</body>
</html>
