version: '3.8'
services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env.txt
    depends_on:
      - db
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    command: ["gunicorn", "--worker-class", "gevent", "-w", "1", "-b", "0.0.0.0:5000", "wsgi:app"]

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=amro_db
      - POSTGRES_USER=amro_user
      - POSTGRES_PASSWORD=your_secure_postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
